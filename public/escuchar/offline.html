<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A12" />
    <title>Radio Elim — Sin conexión</title>
    <link rel="icon" href="/escuchar/icons/icon-192.png" />
    <style>
      :root {
        --bg: #0a0a12;
        --surface: #12121e;
        --text: #f8f8ff;
        --muted: #9090a8;
        --gold: #d4a017;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .tarjeta {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--surface);
        border: 1px solid rgba(212, 160, 23, 0.2);
        border-radius: 16px;
        padding: 32px 24px;
      }
      .icono {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(212, 160, 23, 0.1);
        border: 1px solid rgba(212, 160, 23, 0.33);
      }
      h1 {
        font-size: 18px;
        line-height: 1.4;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        background: var(--gold);
        color: #000;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tarjeta">
        <div class="icono" aria-hidden="true">
          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#d4a017"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9" />
            <path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5" />
            <circle cx="12" cy="9" r="2" />
            <path d="M16.2 4.8c2 2 2.26 5.11.8 7.47" />
            <path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1" />
            <path d="M9.5 18h5" />
            <path d="m8 22 4-11 4 11" />
          </svg>
        </div>
        <h1>Necesitas conexión para escuchar la radio</h1>
        <p>Revisa tu internet o tus datos móviles y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
      </div>
    </main>
    <script>
      // Al volver la conexión, recarga sola.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
